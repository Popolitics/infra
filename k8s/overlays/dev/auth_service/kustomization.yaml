apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: popolitics-dev
resources:
  - ../../../base/auth_service
images:
  - name: ghcr.io/popolitics/auth-service
    newTag: "4cd1514f43ee67bf170339c6f3fc320d0980b573"
patches:
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "True"
