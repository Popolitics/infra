
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: popolitics-dev

resources:
  - ../../../base/kestra

images:
  - name: ghcr.io/popolitics/data
    newTag: "e37c2ed04c1a84c8e74d66db2b6e990c078dc6f1"

patches:
  - target:
      kind: Deployment
      name: kestra
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /srv/popolitics/data/kestra/dev/database

      - op: replace
        path: /spec/template/spec/volumes/2/hostPath/path
        value: /srv/popolitics/data/kestra/dev/docker

      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: |
          micronaut:
            server:
              context-path: "/kestra"

          kestra:
            url: "http://dev.popolitics.local/kestra/"
            plugins:
              configurations:
                - type: io.kestra.plugin.scripts.runner.docker.Docker
                  values:
                    volume-enabled: true

              defaults:
                - type: io.kestra.plugin.scripts.runner.docker.Docker
                  values:
                    host: "tcp://127.0.0.1:2375"
                    volumes:
                      - "/data:/data"

                - type: io.kestra.plugin.scripts.python.Commands
                  values:
                    containerImage: "ghcr.io/popolitics/data-python:latest"
