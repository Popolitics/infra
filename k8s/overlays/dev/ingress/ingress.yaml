apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: popolitics-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: dev.popolitics.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth-service-svc
                port:
                  number: 8000