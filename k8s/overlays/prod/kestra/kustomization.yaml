
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: popolitics-prod
resources:
  - ../../../base/kestra
images:
  - name: ghcr.io/popolitics/data
    newTag: "77fbad0b10b24b42393900c0ac00f9bc4e28df56"
patches:
  - target:
      kind: Deployment
      name: kestra
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /srv/popolitics/data
