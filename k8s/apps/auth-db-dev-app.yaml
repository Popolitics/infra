apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popolitics-auth-db-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Popolitics/infra.git
    targetRevision: dev
    path: k8s/overlays/dev/auth_service_base
  destination:
    server: https://kubernetes.default.svc
    namespace: popolitics-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true