apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popolitics-auth-service-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Popolitics/infra.git
    targetRevision: main
    path: k8s/overlays/prod/auth_service
  destination:
    server: https://kubernetes.default.svc
    namespace: popolitics-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
