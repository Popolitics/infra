apiVersion: argoproj.io/v1alpha1 
kind: Application
metadata:
  name: popolitics-frontend-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Popolitics/infra.git'
    targetRevision: 'feat/frontend-init-argocd-integration-and-frontend-service'
    path: k8s/base/frontend_service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: popolitics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true