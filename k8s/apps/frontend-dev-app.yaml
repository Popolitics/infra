apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popolitics-frontend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Popolitics/infra.git
    targetRevision: dev
    path: k8s/overlays/dev/frontend_service
  destination:
    server: https://kubernetes.default.svc
    namespace: popolitics-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
