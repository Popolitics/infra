apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popolitics-data-db-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Popolitics/infra.git
    targetRevision: main
    path: k8s/overlays/prod/data_service_base
  destination:
    server: https://kubernetes.default.svc
    namespace: popolitics-prod
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
