apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popolitics-kestra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Popolitics/infra.git'
    targetRevision: main
    path: k8s/base/kestra
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: popolitics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true