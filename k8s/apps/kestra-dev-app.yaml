apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popolitics-kestra-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Popolitics/infra.git
    targetRevision: main
    path: k8s/overlays/dev/kestra
  destination:
    server: https://kubernetes.default.svc
    namespace: popolitics-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true