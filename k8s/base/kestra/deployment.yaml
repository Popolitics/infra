apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestra
  namespace: popolitics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kestra
  template:
    metadata:
      labels:
        app: kestra
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: kestra
          image: ghcr.io/popolitics/data
          imagePullPolicy: Always
          args:
            - server
            - local
            - --flow-path
            - /app/flows
          env:
              - name: KESTRA_CONFIGURATION
                value: |
                  micronaut:
                    server:
                      context-path: "/kestra"
                  
                  kestra:
                    url: "http://popolitics.local/kestra/"


          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data-storage
              mountPath: /data
      volumes:
        - name: data-storage
          hostPath:
            path: /srv/popolitics/data
            type: Directory