apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: popolitics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service.yaml
          image: ghcr.io/popolitics/auth-service:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DEBUG
              value: "True"
            - name: DB_NAME
              value: "auth_db"
            - name: DB_USER
              value: "auth_user"
            - name: DB_HOST
              value: "auth-postgres-service.yaml"
            - name: DB_PORT
              value: "5432"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DJANGO_SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DB_PASSWORD