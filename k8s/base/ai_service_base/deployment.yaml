apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-postgres
  namespace: popolitics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-postgres
  template:
    metadata:
      labels:
        app: ai-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: ai_db
            - name: POSTGRES_USER
              value: ai_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DB_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: ai-postgres-pvc