apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: popolitics
spec:
  rules:
    - host: popolitics.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service-svc
                port:
                  number: 8000