apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: popolitics
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
spec:
  rules:
    # 1. Règle pour l'API Django et Swagger
    - host: popolitics.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service-svc
                port:
                  number: 8000
    # 2. Règle pour le service frontend      
    - host: frontend.popolitics.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service-svc
                port:
                  number: 3000
    - host: argocd.popolitics.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
    - host: kestra.popolitics.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kestra-svc
                port:
                  number: 8080